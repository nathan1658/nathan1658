name: Update private-inclusive profile snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-snapshot
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    env:
      PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Explain missing private-stats token
        if: env.PROFILE_STATS_TOKEN == ''
        run: echo "::notice::PROFILE_STATS_TOKEN is not configured; keeping the last generated snapshot."

      - name: Generate light statistics card
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&line_height=29&custom_title=GitHub%20Snapshot%20%28Public%20%2B%20Private%29&bg_color=FFFFFF&title_color=B45309&text_color=24292F&icon_color=0F766E&border_color=D0D7DE
          path: profile/stats-light.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate dark statistics card
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&line_height=29&custom_title=GitHub%20Snapshot%20%28Public%20%2B%20Private%29&bg_color=0F172A&title_color=F59E0B&text_color=E2E8F0&icon_color=14B8A6&border_color=334155
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate light language card
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&card_width=467&custom_title=Most%20Used%20Languages%20%28Public%20%2B%20Private%29&bg_color=FFFFFF&title_color=B45309&text_color=24292F&border_color=D0D7DE
          path: profile/top-langs-light.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate dark language card
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&card_width=467&custom_title=Most%20Used%20Languages%20%28Public%20%2B%20Private%29&bg_color=0F172A&title_color=F59E0B&text_color=E2E8F0&border_color=334155
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Normalize the card grid dimensions
        if: env.PROFILE_STATS_TOKEN != ''
        run: |
          perl -0pi -e 's/height="215"/height="219"/; s/viewBox="0 0 467 215"/viewBox="0 0 467 219"/; s|<title id="titleId"></title>|<title id="titleId">Most Used Languages (Public + Private)</title>|; s|<desc id="descId"></desc>|<desc id="descId">Aggregate language distribution across public and private repositories.</desc>|' profile/top-langs-light.svg profile/top-langs-dark.svg
          perl -pi -e 's/[ \t]+$//' profile/*.svg
          perl -0pi -e 's/\A\n+//; s/\n+\z/\n/' profile/*.svg
          grep -q 'width="467"' profile/stats-light.svg
          grep -q 'height="219"' profile/stats-light.svg
          grep -q 'width="467"' profile/top-langs-light.svg
          grep -q 'height="219"' profile/top-langs-light.svg

      - name: Commit refreshed cards
        if: env.PROFILE_STATS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh private-inclusive profile stats"
          git push
